# This workflow executes end-to-end (e2e) tests using Playwright with PostgreSQL as the database.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Postgresql PR Playwright E2E Tests
on:
  workflow_dispatch:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - openmetadata-docs/**
      - .github/**
      - openmetadata-dist/**
      - docker/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: playwright-ci-pr-postgresql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-ci-postgresql:
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    with:
      database: postgresql
      shard-total: 4
    secrets: inherit

  # Single, shard-count-independent status to mark as "required" in branch
  # protection. The -skip workflow emits the same job name for ignored paths.
  playwright-ci-postgresql-result:
    needs: playwright-ci-postgresql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E result
        run: '[ "${{ needs.playwright-ci-postgresql.result }}" = "success" ]'
