# Nightly flakiness control loop on main:
#   - stability: full suite, each test twice, so flakes surface here before
#     they surface on someone's PR (see the "flaky" artifacts / job summary)
#   - quarantine: @quarantine tests x5 with no retries; a test that is green
#     here for 3 consecutive nights can have its @quarantine tag removed
name: Playwright Nightly Stability

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: playwright-nightly
  cancel-in-progress: false

jobs:
  stability:
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    with:
      database: mysql
      shard-total: 6
      repeat-each: 2
    secrets: inherit

  quarantine:
    uses: ./.github/workflows/playwright-e2e-reusable.yml
    with:
      database: postgresql
      shard-total: 1
      run-quarantine: true
      repeat-each: 5
    secrets: inherit
