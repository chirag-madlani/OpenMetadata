---
env:
  browser: true
  es6: true
  jest: true

extends:
  - eslint:recommended
  - plugin:react/recommended
  - plugin:jest/recommended
  - plugin:jest/style
  - plugin:jest-formatting/recommended
  - plugin:@typescript-eslint/recommended
  - plugin:prettier/recommended
  - prettier
  - plugin:i18next/recommended

parser: '@typescript-eslint/parser'

parserOptions:
  ecmaVersion: 2018
  sourceType: module
  ecmaFeatures:
    jsx: true

plugins:
  - react
  - react-hooks
  - eslint-plugin-jsonc
  - jest
  - jest-formatting
  - '@typescript-eslint'
  - i18next

rules:
  # ESLint rules

  # Require type-safe equality operators
  eqeqeq:
    - error
    - smart

  no-console: 2

  # Require a whitespace at the beginning of a comment
  spaced-comment:
    - error
    - always

  # Maximum line length for comments except trailing comments
  max-len:
    - error
    - comments: 120
      code: 200 # Set to not conflict with Prettier
      ignoreTrailingComments: true
      ignoreUrls: true

  # Require braces around blocks
  curly:
    - error
    - all

  # Require parentheses around arrow function arguments
  arrow-parens:
    - error
    - always

  # Require blank line before certain statements
  padding-line-between-statements:
    - error
    - blankLine: always
      prev: '*'
      next: function
    - blankLine: always
      prev: '*'
      next: class
    - blankLine: always
      prev: '*'
      next: export
    # Ignore consecutive export statements
    - blankLine: any
      prev: export
      next: export
    - blankLine: always
      prev: '*'
      next: return
    - blankLine: always
      prev: '*'
      next: break
    - blankLine: always
      prev: '*'
      next: continue
    - blankLine: always
      prev: '*'
      next: throw

  # eslint-plugin-react rules

  # Require props to be sorted
  react/jsx-sort-props:
    - error
    - callbacksLast: true
      shorthandFirst: true

  # Omit boolean prop value when set to true
  react/jsx-boolean-value:
    - error
    - never

  # Require self closing tags in JSX/HTML
  react/self-closing-comp:
    - error
    - component: true
      html: true

  # Require PascalCase for user-defined JSX components
  react/jsx-pascal-case:
    - error

  react/prop-types:
    - off

  # Disallow unnecessary curly braces in JSX
  react/jsx-curly-brace-presence:
    - error
    - never

  # eslint-plugin-react-hooks rules

  # Enforce rules of hooks
  react-hooks/rules-of-hooks: error

  # eslint-plugin-jsonc rules

  # Require keys to be sorted
  jsonc/sort-keys:
    - error
    - pathPattern: '.*'
      order:
        type: asc

  # eslint-plugin-jest rules

  # Prefer "it" over "test"
  jest/consistent-test-it:
    - error
    - fn: it
      withinDescribe: it

  # Warn for skipped/disabled tests
  jest/no-disabled-tests: warn

  # eslint-plugin-jest-formatting rules

  # Require blank line before certain statements (ESLint rules don't work with Jest)
  jest-formatting/padding-around-all: error

  # @typescript-eslint rules

  # Require explicit return type on functions and class methods
  '@typescript-eslint/explicit-function-return-type':
    - off

  # disable the rule for all files
  '@typescript-eslint/explicit-module-boundary-types':
    - off

  '@typescript-eslint/no-use-before-define': warn

  # React rules

  react/display-name:
    - off

  # React rules

  # i18next rules

  i18next/no-literal-string: error

  # i18next rules

overrides:
  # eslint-plugin-jsonc requires its own parser
  - files:
      - '*.json'
    parser: jsonc-eslint-parser
    rules:
      eol-last:
        - off

  # disable rules on generated files
  - files:
      - src/generated/**/*.ts
    rules:
      max-len:
        - off

  # Certain rules not required for JSON files
  - files:
      - '*.json'
    rules:
      max-len:
        - off
      jsonc/sort-keys:
        - off
  - files:
      - src/locale/**/*.json
    rules:
      jsonc/sort-keys:
        - error

  # Explicit assertions not required in most Playwright tests
  - files:
      - playwright/**
    rules:
      jest/expect-expect:
        - off
      jest/valid-expect-in-promise:
        - off
      jest/valid-expect:
        - off
      jest/valid-describe:
        - off
      jest/consistent-test-it:
        - off
      jest/no-done-callback:
        - off
      jest/no-standalone-expect:
        - off
      jest/no-conditional-expect:
        - off
      # Flakiness guardrails. `warn` while legacy specs are migrated; the
      # override below makes them errors for the new fixture/infra layer.
      # Rationale for each rule: playwright/README.md -> "Banned patterns".
      no-restricted-syntax:
        - warn
        - &pwNoHardWait
          selector: CallExpression[callee.property.name='waitForTimeout']
          message: Hard waits are banned. Wait for a UI state (expect(locator)...) or a response (utils/wait.ts).
        - &pwNoDiscardedState
          selector: ExpressionStatement > AwaitExpression > CallExpression[callee.property.name=/^(isVisible|isHidden|isEnabled|isDisabled|isChecked|isEditable)$/]
          message: The result is discarded, so this asserts nothing. Use `await expect(locator).toBeVisible()` (or toBeEnabled, toBeChecked, ...).
        - &pwNoForce
          selector: Property[key.name='force'][value.value=true]
          message: "`force: true` skips actionability checks and hides real bugs (overlays, disabled buttons). Wait for the blocking element to go away instead."
        - &pwNoPageSelectorActions
          selector: CallExpression[callee.object.name='page'][callee.property.name=/^(click|dblclick|fill|type|hover|check|uncheck|press|selectOption|tap|focus|textContent|innerText|getAttribute|isVisible)$/]
          message: Use locator APIs (`page.getByTestId(id).click()`); `page.<action>(selector)` is discouraged and does not auto-retry assertions.
        - &pwNoWaitForSelector
          selector: CallExpression[callee.property.name='waitForSelector']
          message: Use a web-first assertion (`await expect(locator).toBeVisible()`) instead of waitForSelector.
        - &pwNoNetworkIdle
          selector: CallExpression[callee.property.name='waitForLoadState'] > Literal[value='networkidle']
          message: networkidle is unreliable with polling/websockets. Wait for the specific response or element.
        - &pwNoSerial
          selector: MemberExpression[object.property.name='describe'][property.name='serial'], Property[key.name='mode'][value.value='serial']
          message: Serial mode couples tests so one failure (or retry) cascades. Make each test independent with fixtures.
        - &pwNoOnly
          selector: MemberExpression[object.name='test'][property.name='only'], MemberExpression[object.property.name='describe'][property.name='only']
          message: Remove `.only` before committing.

  - files:
      - playwright/fixtures/**
      - playwright/config/**
      - playwright/reporters/**
      - playwright/utils/wait.ts
    rules:
      no-restricted-syntax:
        - error
        - *pwNoHardWait
        - *pwNoDiscardedState
        - *pwNoForce
        - *pwNoPageSelectorActions
        - *pwNoWaitForSelector
        - *pwNoNetworkIdle
        - *pwNoSerial
        - *pwNoOnly

  # i18next rule is not required for js, jsx, json and test file
  - files:
      - src/**/*.{js,jsx,json}
      - src/**/*.test.{tsx,ts}
      - src/**/*.mock.{tsx,ts}
    rules:
      i18next/no-literal-string:
        - off

  # i18next rule is not required for js, jsx, json and test file
  - files:
      - src/**/*.{js,jsx,json}
      - src/**/*.test.{tsx,ts}
      - src/**/*.mock.{tsx,ts}
    rules:
      i18next/no-literal-string:
        - off

settings:
  import/resolver:
    babel-module:
      root:
        - './src'
      extensions:
        - '.js'
        - '.jsx'
        - '.png'
        - '.svg'
  react:
    version: detect
